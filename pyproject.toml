[project]
name = "market_analysis"
version = "0.1.0"
description = "market_analysis using crewAI"
authors = [{ name = "shyam pethakamsetty", email = "shyampethakamsetty@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.121.1,<1.0.0"
]

[project.scripts]
market_analysis = "market_analysis.main:run"
run_crew = "market_analysis.main:run"
train = "market_analysis.main:train"
replay = "market_analysis.main:replay"
test = "market_analysis.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
